name: mac-diag (temporary)
on:
  push:
    branches: ["ci/mac-arm-runner"]
permissions:
  contents: read
jobs:
  diag:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      PYTHON_VERSION: "3.12"
      PYINSTALLER_VERSION: "6.22.3"
      PYINSTALLER_HOOKS_VERSION: "2026.8"
      PYWEBVIEW_VERSION: "6.2.1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: sw_vers; uname -m; xcodebuild -version || true; brew --version
      - run: echo 0.0.0-diag > VERSION; git rev-parse --short HEAD > COMMIT
      - run: |
          cp requirements.lock.txt req.txt; if [ "$(uname -m)" = x86_64 ]; then sed -i '' 's/^onnxruntime==.*/onnxruntime==1.23.2/' req.txt; fi
          pip install -r req.txt "pyinstaller==$PYINSTALLER_VERSION" "pyinstaller-hooks-contrib==$PYINSTALLER_HOOKS_VERSION" "pywebview==$PYWEBVIEW_VERSION"
      - run: bash packaging/macos/bundle_tesseract.sh
      - run: pyinstaller packaging/gac.spec --noconfirm
      - name: check the app's tesseract
        run: |
          A="dist/GAC Card Scanner.app/Contents"; T="$A/Frameworks/tesseract/tesseract"
          ls -la "$A/Frameworks/tesseract" "$A/Resources/tesseract"; otool -L "$T"; vtool -show-build "$T" | grep -E "minos|sdk"
          TESSDATA_PREFIX="$A/Frameworks/tesseract/tessdata" "$T" --version
      - run: codesign --force --deep --sign - "dist/GAC Card Scanner.app" && codesign --verify --deep --strict "dist/GAC Card Scanner.app"
      - name: minimum macOS of every Mach-O in the app (information)
        run: |
          find "dist/GAC Card Scanner.app" -type f \( -perm -u+x -o -name '*.dylib' -o -name '*.so' \) -print0 | xargs -0 -n1 sh -c 'v=$(vtool -show-build "$0" 2>/dev/null | awk "/minos/{print \$2; exit}"); [ -n "$v" ] && echo "$v $0"' | sort -V | tail -8
      - run: python packaging/smoke_test.py "dist/GAC Card Scanner.app/Contents/MacOS/GAC Card Scanner"
