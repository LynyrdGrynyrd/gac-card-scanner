name: CI
on:
  push:
    branches: ["**"]
  pull_request:
permissions:
  contents: read
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: sudo apt-get update && sudo apt-get install -y tesseract-ocr
      - run: pip install -r requirements.lock.txt pytest httpx
      - run: python -m pytest -q tests/unit
      - name: Launcher smoke test (headless, from source)
        run: python packaging/smoke_test.py packaging/launcher.py
